# On every push to main that touches the script, rebuild the PixInsight update
# repository and publish it to the `pixinsight-repo` branch, which PixInsight reads via:
#   https://raw.githubusercontent.com/2bitoperations/pixinsight-savejpeg/pixinsight-repo/
name: Publish PixInsight repository

on:
  push:
    branches: [main]
    paths:
      - SaveStretchedJPEG.js
      - build.sh
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-pixinsight-repo
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build.sh dates the package from the script's last commit

      - name: Build repository
        run: ./build.sh

      - name: Publish to pixinsight-repo branch
        run: |
          cd repository
          git init -q -b pixinsight-repo
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "PixInsight repository built from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" pixinsight-repo
